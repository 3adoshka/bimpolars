name: Enterprise openBIM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest tests/test_enterprise_openbim.py -v
      - run: uv run bimpolars --help
